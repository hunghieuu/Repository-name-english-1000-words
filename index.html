function save(){localStorage.setItem('learned',JSON.stringify([...learned]));localStorage.setItem('favs',JSON.stringify([...favs]));}
function render(){
 const q=$('search').value.toLowerCase(), t=$('topic').value;
 const arr=words.filter(x=>(!t||x.topic===t)&&(!q||x.word.includes(q)||x.meaning.toLowerCase().includes(q)));
 $('list').innerHTML=arr.map(x=>`<article class="card"><div class="topic">${x.topic}</div><div class="word">${x.word}</div><div class="meaning">${x.meaning}</div><div class="ex">${x.example}</div><div class="actions"><button onclick="speak('${x.word.replaceAll("'","")}')">🔊 Nghe</button><button onclick="toggleLearn('${x.word}')">${learned.has(x.word)?'✓ Đã thuộc':'Đánh dấu'}</button><button class="star" onclick="toggleFav('${x.word}')">${favs.has(x.word)?'★':'☆'}</button></div></article>`).join('');
}
function updateStats(){
 $('learned').textContent=learned.size;$('fav').textContent=favs.size;
 const p=learned.size/words.length*100;$('bar').style.width=p+'%';$('bar2').style.width=p+'%';
 $('progressText').textContent=`Bạn đã học ${learned.size}/${words.length} từ (${p.toFixed(1)}%).`;
 const counts={}; words.forEach(x=>{counts[x.topic]??={n:0,l:0};counts[x.topic].n++;if(learned.has(x.word))counts[x.topic].l++});
 $('topicProgress').innerHTML=Object.entries(counts).map(([t,v])=>`<p><b>${t}</b>: ${v.l}/${v.n} — ${Math.round(v.l/v.n*100)}%</p>`).join('');
}
function toggleLearn(w){learned.has(w)?learned.delete(w):learned.add(w);save();render();updateStats()}
function toggleFav(w){favs.has(w)?favs.delete(w):favs.add(w);save();render();updateStats()}
function speak(w){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.speak(u)}}
function randomWord(){flashIndex=Math.floor(Math.random()*words.length);showFlash();showPage('flash')}
function showFlash(){let x=words[flashIndex];$('fTopic').textContent=x.topic;$('fWord').textContent=x.word;$('fMeaning').textContent=x.meaning;$('fEx').textContent=x.example;$('fMeaning').classList.add('hidden');$('fEx').classList.add('hidden');$('flip').textContent='Hiện nghĩa';speak(x.word)}
function flip(){['fMeaning','fEx'].forEach(id=>$(id).classList.toggle('hidden'));$('flip').textContent=$('fMeaning').classList.contains('hidden')?'Hiện nghĩa':'Ẩn nghĩa'}
function nextCard(){flashIndex=(flashIndex+1)%words.length;showFlash()} function prevCard(){flashIndex=(flashIndex-1+words.length)%words.length;showFlash()}
function markLearned(){learned.add(words[flashIndex].word);save();updateStats();nextCard()}

function setupQuiz(){quizMode=localStorage.getItem('quizMode')||'envi';nextQuiz()}
function setQuizMode(m){quizMode=m;localStorage.setItem('quizMode',m);nextQuiz()}
function buildOptions(correct,key){
 const opts=[correct];let guard=0;
 while(opts.length<4&&guard++<200){const x=words[Math.floor(Math.random()*words.length)][key];if(x&&!opts.includes(x))opts.push(x)}
 return opts.sort(()=>Math.random()-.5);
}
function nextQuiz(){
 answered=false;$('qResult').classList.add('hidden');quizWord=words[Math.floor(Math.random()*words.length)];
 const correct=quizMode==='envi'?quizWord.meaning:quizWord.word;
 $('qTitle').textContent=quizMode==='envi'?`"${quizWord.word}" nghĩa là gì?`:`"${quizWord.meaning}" là từ nào?`;
 const key=quizMode==='envi'?'meaning':'word';
 $('options').innerHTML=buildOptions(correct,key).map(o=>`<button class="option" onclick="answerQuiz(this,'${o.replaceAll("'","")}')">${o}</button>`).join('');
}
function answerQuiz(btn,val){
 if(answered)return;answered=true;
 const correct=quizMode==='envi'?quizWord.meaning:quizWord.word,ok=val===correct;
 document.querySelectorAll('#options .option').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});
 if(ok){btn.classList.add('correct');learned.add(quizWord.word);delete wrongMap[quizWord.word];$('qResult').className='result good';$('qResult').textContent='✅ Chính xác!'}
 else{btn.classList.add('wrong');wrongMap[quizWord.word]=(wrongMap[quizWord.word]||0)+1;$('qResult').className='result bad';$('qResult').textContent=`❌ Chưa đúng. Đáp án đúng: ${correct}`}
 save();updateStats();
}
function showPage(p){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));$(p).classList.remove('hidden');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='flash')showFlash();if(p==='progress')updateStats()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
$('search').oninput=render;$('topic').onchange=render;
init();
</script>
